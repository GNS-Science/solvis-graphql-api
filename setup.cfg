[coverage:run]
# uncomment the following to omit files during running
omit =
    solvis_graphql_api/pynamodb_config.py
    solvis_graphql_api/handler.py
    solvis_graphql_api/tests/*
    solvis_graphql_api/ab_test/ab_test.py
    solvis_graphql_api/ab_test/client
    solvis_graphql_api/scripts/cli.py
    solvis_graphql_api/scripts/cli_ab_test.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    if TYPE_CHECKING:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    def main

[tox:tox]
isolated_build = true
requires = tox-uv
envlist = audit, py312, format, lint, build

[gh-actions]
python =
    3.12: py312, format, lint, build

[testenv]
allowlist_externals = pytest
dependency_groups = dev
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
    TESTING = 1
commands =
    pytest --cov=solvis_graphql_api --cov-branch --cov-report=xml --cov-report=term-missing

[testenv:audit]
allowlist_externals =
	uv
commands =
    uv export --all-groups --format requirements-txt --no-emit-project --output-file audit.txt
    uv run pip-audit -r audit.txt --require-hashes
	uv run safety scan

[testenv:format]
allowlist_externals =
    ruff
dependency_groups = dev
commands =
    ruff format .

[testenv:lint]
allowlist_externals =
    ruff
    mypy
dependency_groups = dev
commands =
    ruff check .
    mypy solvis_graphql_api

[testenv:build]
allowlist_externals =
    uv
commands =
    uv build


[tool:pytest]
markers =
    slow: slow tests
